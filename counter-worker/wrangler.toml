#:schema node_modules/wrangler/config-schema.json
name = "garylife-counter"
main = "worker.js"
compatibility_date = "2026-09-01"

# 部署后可以通过 https://garylife-counter.<你的子域>.workers.dev 访问
workers_dev = true

# KV 命名空间。
# 先执行：npx wrangler kv namespace create COUNTER
# 命令会打印一段 id，把它替换到下面。
[[kv_namespaces]]
binding = "COUNTER"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"
